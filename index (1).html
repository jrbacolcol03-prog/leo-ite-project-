
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Tales Storybook</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #fffaf3;
    color: #39434d;
}

header {
    background: #d9ecf7;
    text-align: center;
    padding: 35px 20px;
}

header h1 {
    color: #35566b;
    font-size: 34px;
    margin-bottom: 10px;
}

header p {
    color: #536b7a;
    line-height: 1.6;
}

nav {
    background: #fff;
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #eee4d8;
}

nav a {
    color: #536b7a;
    text-decoration: none;
    margin: 0 12px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1150px;
    margin: 30px auto;
    padding: 0 20px;
}

.section-title {
    margin-bottom: 10px;
    color: #35566b;
}

.description {
    color: #777;
    margin-bottom: 20px;
    line-height: 1.6;
}

#search {
    width: 100%;
    padding: 14px;
    border: 1px solid #d9e3e9;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 25px;
    outline-color: #8bbbd3;
}

.story-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
}

.story-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 12px #52606b12;
    border: 1px solid #f0e8df;
    transition: transform 0.2s;
}

.story-card:hover {
    transform: translateY(-4px);
}

.story-card img {
    width: 100%;
    height: 165px;
    object-fit: cover;
    background: #e5edf0;
    display: block;
}

.story-info {
    padding: 17px;
}

.genre {
    display: inline-block;
    background: #e5f2f8;
    color: #42677d;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 10px;
}

.story-info h3 {
    color: #35566b;
    margin-bottom: 9px;
}

.story-info p {
    color: #747474;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 15px;
}

button {
    background: #78a9c2;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #5788a3;
}

#reader {
    display: none;
    background: white;
    max-width: 800px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px #52606b12;
}

#reader img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 12px;
    margin: 20px 0;
    background: #e5edf0;
}

#reader h2 {
    color: #35566b;
    margin: 15px 0;
}

#reader p {
    line-height: 1.9;
    white-space: pre-line;
    margin: 15px 0 25px;
}

#reader .genre {
    margin-top: 15px;
}

.back-button {
    background: #e8a994;
    margin-bottom: 10px;
}

.back-button:hover {
    background: #cf8e78;
}

footer {
    background: #d9ecf7;
    color: #536b7a;
    text-align: center;
    padding: 22px;
    margin-top: 45px;
}

@media (max-width: 500px) {
    header h1 {
        font-size: 27px;
    }

    .container {
        padding: 0 14px;
    }

    #reader {
        padding: 16px;
    }
}
</style>
</head>

<body>

<header id="top">
    <h1> Little Tales</h1>
    <p>A little place for big imaginations.</p>
</header>

<nav>
    <a href="#" onclick="showHome(); return false;">Home</a>
    <a href="#stories" onclick="showHome(); return false;">Stories</a>
</nav>

<main class="container">

    <section id="home">
        <h2 class="section-title">Discover a Story ✨</h2>
        <p class="description">
            Explore magical places, meet new friends, and enjoy
            30 original short stories made for curious readers.
        </p>

        <input
            type="text"
            id="search"
            placeholder="🔍 Search stories or genres..."
            oninput="displayStories()"
        >

        <div id="storyList" class="story-grid"></div>
    </section>

    <section id="reader">
        <button class="back-button" onclick="showHome()">← Back to Stories</button>
        <div id="storyDetails"></div>
    </section>

</main>

<footer>
    <p> Leo Bacolcol Jr</p>
    <p>Little Tales Storybook © 2026</p>
    <p>ITE PROJECT.</p>
</footer>

<script>
const stories = [
{

const storyList = document.getElementById("storyList");
const home = document.getElementById("home");
const reader = document.getElementById("reader");
const storyDetails = document.getElementById("storyDetails");
const search = document.getElementById("search");

function displayStories() {
    const query = search.value.toLowerCase().trim();

    const filtered = stories
        .map((story, index) => ({ ...story, index }))
        .filter(story =>
            story.title.toLowerCase().includes(query) ||
            story.genre.toLowerCase().includes(query)
        );

    storyList.innerHTML = "";

    if (filtered.length === 0) {
        storyList.innerHTML = "<p>No stories found. Try another search.</p>";
        return;
    }

    filtered.forEach(story => {
        const card = document.createElement("article");
        card.className = "story-card";

        const img = document.createElement("img");
        img.src = story.image;
        img.alt = story.title;
        img.loading = "lazy";
        img.onerror = function() {
            this.style.display = "none";
        };

        const info = document.createElement("div");
        info.className = "story-info";

        const genre = document.createElement("span");
        genre.className = "genre";
        genre.textContent = story.genre;

        const title = document.createElement("h3");
        title.textContent = story.title;

        const preview = document.createElement("p");
        preview.textContent = story.content.slice(0, 90) + "...";

        const button = document.createElement("button");
        button.textContent = "Read Story →";
        button.onclick = () => readStory(story.index);

        info.append(genre, title, preview, button);
        card.append(img, info);
        storyList.appendChild(card);
    });
}

function readStory(index) {
    const story = stories[index];

    home.style.display = "none";
    reader.style.display = "block";

    storyDetails.innerHTML = "";

    const title = document.createElement("h2");
    title.textContent = story.title;

    const genre = document.createElement("span");
    genre.className = "genre";
    genre.textContent = story.genre;

    const img = document.createElement("img");
    img.src = story.image;
    img.alt = story.title;
    img.onerror = function() {
        this.style.display = "none";
    };

    const content = document.createElement("p");
    content.textContent = story.content;

    storyDetails.append(genre, title, img, content);
    window.scrollTo(0, 0);
}

function showHome() {
    reader.style.display = "none";
    home.style.display = "block";
    window.scrollTo(0, 0);
}

displayStories();
</script>

</body>
</html>
